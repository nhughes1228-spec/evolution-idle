<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolution Idle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">Primordial Simulation 0.1</p>
        <h1>Evolution Idle</h1>
        <p class="subtitle">Begin as chemistry in a quiet ocean. Discover traits, unlock eras, and guide life through deep time.</p>
      </div>
      <button id="resetBtn" class="ghost">Reset Save</button>
    </header>

    <main class="layout">
      <section class="panel main-panel">
        <div class="era-row">
          <div>
            <p class="label">Current Era</p>
            <h2 id="eraName">Primordial Soup</h2>
          </div>
          <div class="badge" id="organismName">Prebiotic Chemistry</div>
        </div>

        <div class="resource-card">
          <p class="label">Biomass</p>
          <div class="resource-line"><span id="biomass">0</span><span class="rate">+<span id="biomassRate">0</span>/sec</span></div>
          <button id="clickBtn" class="primary">Catalyze Reactions</button>
        </div>

        <div class="progress-wrap">
          <div class="progress-label"><span>Next Discovery</span><span id="nextDiscoveryText">Cell Membrane</span></div>
          <div class="progress"><div id="progressFill"></div></div>
        </div>
      </section>

      <section class="panel">
        <h2>Discoveries</h2>
        <div id="upgrades" class="upgrade-list"></div>
      </section>

      <section class="panel timeline-panel">
        <h2>Timeline</h2>
        <div id="timeline" class="timeline"></div>
      </section>
    </main>
  </div>

  <script src="game.js"></script>
</body>
</html>
