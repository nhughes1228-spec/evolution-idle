<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolution Idle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="top-bar">
      <div class="speed">x<span id="speedDisplay">1</span></div>
      <button id="resetBtn" class="menu-btn">Menu</button>
    </header>

    <main class="screen">
      <section class="research-list" id="researchList" aria-label="Research options"></section>
    </main>

    <section class="era-strip" aria-label="Eras">
      <button class="era-tab active">I</button>
      <button class="era-tab" id="eraTwoTab">II</button>
      <button class="era-tab locked">III</button>
      <button class="era-tab locked">IV</button>
      <button class="era-tab locked">V</button>
    </section>

    <section class="resource-board" aria-label="Resources">
      <div class="primary-resource">
        <div class="resource-symbol">🧬</div>
        <div><span id="biomassDisplay">0</span> biomass</div>
      </div>

      <div class="resource-grid">
        <div class="resource insight"><span id="insightMult">x1.00</span> 💡</div>
        <div class="resource energy"><span id="energyMult">x1.00</span> ⚡</div>
        <div class="resource stability"><span id="stabilityMult">x1.00</span> 🛡️</div>
        <div class="resource adaptation"><span id="adaptationDisplay">0</span> 🧭</div>
        <div class="resource complexity"><span id="complexityDisplay">0</span> ✦</div>
        <div class="resource tools"><span id="toolDisplay">0</span> 🔨</div>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="Game sections">
      <button class="nav-btn active">💡</button>
      <button class="nav-btn">🧬</button>
      <button class="nav-btn">🧭</button>
      <button class="nav-btn">🌀</button>
    </nav>
  </div>

  <script src="game.js"></script>
</body>
</html>
