<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evolution Idle</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-shell">
    <header class="top-bar">
      <div class="speed">x<span id="speedDisplay">1</span></div>
      <button id="resetBtn" class="menu-btn">Menu</button>
    </header>

    <main class="screen">
      <section class="view active" id="ideasView">
        <section class="research-list" id="researchList" aria-label="Research options"></section>
        <section class="era-strip" aria-label="Eras">
          <button class="era-tab active">I</button>
          <button class="era-tab locked">II</button>
          <button class="era-tab locked">III</button>
          <button class="era-tab locked">IV</button>
          <button class="era-tab locked">V</button>
          <button class="era-tab locked">VI</button>
          <button class="era-tab locked">VII</button>
          <button class="era-tab locked">VIII</button>
          <button class="era-tab locked">IX</button>
          <button class="era-tab locked">X</button>
        </section>
      </section>

      <section class="view" id="productionView">
        <div class="placeholder-panel">Production will come next.</div>
      </section>

      <section class="view" id="explorationView">
        <section class="exploration-list" id="explorationList"></section>
      </section>

      <section class="view" id="prestigeView">
        <div class="placeholder-panel">Prestige will come later.</div>
      </section>
    </main>

    <section class="resource-board" aria-label="Resources">
      <div class="resource-grid" id="resourceGrid"></div>
    </section>

    <nav class="bottom-nav" aria-label="Game sections">
      <button class="nav-btn active" data-view="ideas">💡</button>
      <button class="nav-btn" data-view="production">🔨</button>
      <button class="nav-btn" data-view="exploration">🧭</button>
      <button class="nav-btn" data-view="prestige">🌀</button>
    </nav>
  </div>

  <script src="game.js"></script>
</body>
</html>
